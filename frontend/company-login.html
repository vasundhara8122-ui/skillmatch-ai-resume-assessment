<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Login - SkillMatch AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">SkillMatch<span> AI</span></a>
      <div class="nav-links">
        <a href="/student-login.html">Student Login</a>
      </div>
    </div>
  </nav>

  <div class="login-page">
    <div class="card login-card">
      <h2>Company / HR Login</h2>
      <p class="subtitle">Sign in to manage candidate assessments</p>

      <div id="loginError" class="alert alert-error hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="hr@skillmatch.ai" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Login</button>
      </form>

      <div class="demo-info">
        <strong>Demo Credentials:</strong>
        Email: hr@skillmatch.ai<br>
        Password: hr123
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      showLoading(btn);
      try {
        const data = await apiCall('/api/auth/company/login', {
          method: 'POST',
          body: { email: document.getElementById('email').value, password: document.getElementById('password').value }
        });
        saveSession('companySession', data);
        window.location.href = '/company-dashboard.html';
      } catch (err) {
        showError('loginError', err.message);
      } finally {
        hideLoading(btn);
      }
    });
  </script>
</body>
</html>
