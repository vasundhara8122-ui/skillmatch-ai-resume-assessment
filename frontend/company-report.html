<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Candidate Report - SkillMatch AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">SkillMatch<span> AI</span></a>
      <div class="nav-links">
        <a href="/company-dashboard.html">Dashboard</a>
        <a href="#" onclick="logout('company')">Logout</a>
      </div>
    </div>
  </nav>

  <div class="dashboard-header">
    <div class="container">
      <h1>Candidate Assessment Report</h1>
      <p>Detailed skill analysis and assessment results</p>
    </div>
  </div>

  <div class="container" style="padding-top:32px;padding-bottom:64px;" id="reportContent">
    <div class="alert alert-info"><span class="loading"></span> Loading report...</div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    checkCompanyAuth();
    const candidateId = getQueryParam('candidate_id');

    async function loadReport() {
      if (!candidateId) {
        document.getElementById('reportContent').innerHTML = '<div class="alert alert-error">No candidate specified.</div>';
        return;
      }

      try {
        const data = await apiCall(`/api/report/candidate/${candidateId}`);
        renderReport(data);
      } catch (err) {
        document.getElementById('reportContent').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function safeNum(val) {
      if (val === null || val === undefined || val === '' || isNaN(val)) return 0;
      return Number(val);
    }

    function safeStr(val, fallback) {
      if (val === null || val === undefined || val === '' || val === 'Not Found') return fallback || 'N/A';
      return String(val);
    }

    function renderReport(data) {
      const { candidate, skills, assessment, result, skill_scores, skill_matches } = data;
      const c = candidate || {};

      let html = '<div class="card">';

      html += `
        <div style="text-align:center;margin-bottom:32px;">
          <h2>SKILLMATCH AI REPORT</h2>
          <p style="color:var(--text-muted)">Assessment ID: ${assessment ? assessment.id : 'N/A'}</p>
        </div>

        <div class="report-section">
          <h3>Candidate</h3>
          <div style="margin-bottom:8px;"><strong>Name:</strong> ${safeStr(c.name, 'N/A')}</div>
          <div style="margin-bottom:8px;"><strong>Email:</strong> ${safeStr(c.email, 'N/A')}</div>
          <div style="margin-bottom:8px;"><strong>Phone:</strong> ${safeStr(c.phone, 'Not found')}</div>
          <div style="margin-bottom:8px;"><strong>Degree:</strong> ${safeStr(c.degree, 'N/A')}</div>
          <div style="margin-bottom:8px;"><strong>Graduation Year:</strong> ${safeStr(c.graduation_year, 'N/A')}</div>
        </div>
      `;

      html += `
        <div class="report-section">
          <h3>Detected Skills</h3>
          <div>${(skills || []).map(s => `<span class="skill-tag">${typeof s === 'string' ? s : (s.name || 'Unknown')}</span>`).join('')}</div>
        </div>
      `;

      if (result) {
        const percentage = safeNum(result.percentage);
        const correctCount = safeNum(result.correct_count);
        const totalQuestions = safeNum(result.total_questions);
        const assessmentLevel = assessment ? safeStr(assessment.level, '') : '';

        html += `
          <div class="report-section">
            <h3>Assessment</h3>
            <div style="margin-bottom:8px;"><strong>Level:</strong> ${assessmentLevel} - ${assessmentLevel === 'Level 1' ? 'Medium' : 'Hard'}</div>
            <div style="margin-bottom:8px;"><strong>Questions:</strong> ${totalQuestions}</div>
            <div style="margin-bottom:8px;"><strong>Completed:</strong> ${correctCount}/${totalQuestions}</div>
            <div style="margin-bottom:8px;"><strong>Overall Score:</strong> <span style="font-size:1.5rem;font-weight:800;color:var(--primary)">${percentage}%</span></div>
          </div>
        `;

        html += `
          <div class="report-section">
            <h3>Skill Performance</h3>
        `;
        (skill_scores || []).forEach(s => {
          const pct = safeNum(s.percentage);
          const color = getProgressColor(pct);
          html += `
            <div class="skill-bar">
              <div class="skill-label"><span>${safeStr(s.skill, 'Unknown')}</span><span class="pct">${pct}%</span></div>
              <div class="progress-bar"><div class="fill ${color}" style="width:${Math.min(pct, 100)}%"></div></div>
            </div>
          `;
        });
        html += '</div>';

        html += `
          <div class="report-section">
            <h3>Score Breakdown</h3>
            <div class="stat-grid">
              <div class="stat-card"><div class="stat-value">${safeNum(result.theory_score)}</div><div class="stat-label">Theory</div></div>
              <div class="stat-card"><div class="stat-value">${safeNum(result.mcq_score)}</div><div class="stat-label">MCQ</div></div>
              <div class="stat-card"><div class="stat-value">${safeNum(result.code_output_score)}</div><div class="stat-label">Code Output</div></div>
              <div class="stat-card"><div class="stat-value">${safeNum(result.debugging_score)}</div><div class="stat-label">Debugging</div></div>
              <div class="stat-card"><div class="stat-value">${safeNum(result.coding_score)}</div><div class="stat-label">Coding</div></div>
              <div class="stat-card"><div class="stat-value">${safeNum(result.sql_score)}</div><div class="stat-label">SQL</div></div>
              <div class="stat-card"><div class="stat-value">${correctCount}</div><div class="stat-label">Correct</div></div>
              <div class="stat-card"><div class="stat-value">${totalQuestions}</div><div class="stat-label">Total</div></div>
            </div>
          </div>
        `;

        if (skill_matches && skill_matches.length > 0) {
          html += `
            <div class="report-section">
              <h3>AI Skill Match</h3>
          `;
          skill_matches.forEach(m => {
            const pct = safeNum(m.match_percentage);
            const cls = getMatchClass(pct);
            html += `
              <div class="match-card ${cls}">
                <div class="role-name">${safeStr(m.role_name, 'Unknown')}</div>
                <div class="match-pct">${pct}%</div>
              </div>
            `;
          });
          html += '</div>';
        }
      } else {
        const status = assessment ? safeStr(assessment.status, 'pending') : 'pending';
        html += `
          <div class="report-section">
            <h3>Assessment</h3>
            <p style="color:var(--text-muted)">Assessment status: <span class="badge badge-${status === 'completed' ? 'success' : 'pending'}">${status}</span></p>
            <p style="color:var(--text-muted)">The candidate has not completed the assessment yet.</p>
          </div>
        `;
      }

      html += `
        <div class="report-note">
          <strong>Note:</strong> The skill-match percentages are based on resume information and assessment performance.
          Final employment decisions are made by the company/HR.
        </div>
      `;

      html += '</div>';

      html += `<div style="display:flex;gap:12px;justify-content:center;margin-top:24px;">
        <a href="/company-dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
        <button class="btn btn-primary" onclick="window.print()">Print Report</button>
      </div>`;

      document.getElementById('reportContent').innerHTML = html;
    }

    loadReport();
  </script>
</body>
</html>
